<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Criar Conta - BCM-TAXI</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron&display=swap');
  body {
    margin: 0; min-height: 100vh; background: #000;
    font-family: 'Orbitron', sans-serif;
    color: #f00;
    display: flex; justify-content: center; align-items: center;
    padding: 20px;
  }
  .container {
    background: #111;
    border: 2px solid #f00;
    border-radius: 10px;
    padding: 30px;
    width: 320px;
    box-shadow:
      0 0 10px #f00,
      0 0 20px #f00,
      0 0 30px #ff0000;
  }
  h2 {
    text-align: center;
    margin-bottom: 20px;
    text-shadow: 0 0 10px #f00;
  }
  label {
    display: block;
    margin-bottom: 5px;
    font-weight: bold;
  }
  input[type="text"], input[type="email"], input[type="password"] {
    width: 100%;
    padding: 8px;
    margin-bottom: 15px;
    border: 1px solid #f00;
    border-radius: 5px;
    background: #222;
    color: #f00;
    font-size: 1rem;
  }
  input::placeholder {
    color: #f44;
  }
  button {
    width: 100%;
    padding: 10px;
    background: #f00;
    border: none;
    border-radius: 5px;
    color: #000;
    font-weight: bold;
    font-size: 1.1rem;
    cursor: pointer;
    box-shadow:
      0 0 10px #f00,
      0 0 20px #ff0000;
    transition: background 0.3s ease;
  }
  button:hover {
    background: #ff4444;
  }
  .links {
    margin-top: 15px;
    text-align: center;
  }
  .links a {
    color: #f00;
    text-decoration: none;
    margin: 0 10px;
    font-size: 0.9rem;
    transition: color 0.3s ease;
  }
  .links a:hover {
    color: #ff4444;
  }
  .info-message {
    text-align: center;
    color: #0f0;
    font-weight: bold;
    margin-bottom: 15px;
    text-shadow:
      0 0 5px #0f0,
      0 0 10px #0f0;
    display: none;
  }
</style>
</head>
<body>
  <div class="container">
    <h2>Criar Conta BCM-TAXI</h2>
    <div class="info-message" id="infoMessage">Conta criada com sucesso!</div>
    <form id="createAccountForm">
      <label for="newUsername">Usuário</label>
      <input type="text" id="newUsername" name="newUsername" placeholder="Digite seu usuário" required />
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Digite seu email" required />
      <label for="newPassword">Senha</label>
      <input type="password" id="newPassword" name="newPassword" placeholder="Digite sua senha" required />
      <button type="submit">Criar Conta</button>
    </form>
    <div class="links">
      <a href="login.html">Voltar ao Login</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('createAccountForm');
    const infoMessage = document.getElementById('infoMessage');

    form.addEventListener('submit', e => {
      e.preventDefault();
      // Simula criação de conta bem-sucedida
      infoMessage.style.display = 'block';
      form.style.opacity = '0.5';
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);
    });
  </script>
</body>
</html>
