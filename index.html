<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BCM-TAXI - Bem-vindo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron&display=swap');
  body {
    margin: 0; height: 100vh; background: #000;
    display: flex; justify-content: center; align-items: center;
    font-family: 'Orbitron', sans-serif;
    color: #f00;
    overflow: hidden;
  }
  .welcome {
    font-size: 3rem;
    text-shadow:
      0 0 5px #f00,
      0 0 10px #f00,
      0 0 20px #f00,
      0 0 40px #ff0000,
      0 0 80px #ff0000;
    animation: flicker 3s ease-in-out forwards;
  }
  @keyframes flicker {
    0%, 100% {opacity: 0;}
    50% {opacity: 1;}
  }
  .company-name {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 4rem;
    color: #ff0000;
    text-shadow:
      0 0 10px #ff0000,
      0 0 20px #ff0000,
      0 0 30px #ff0000,
      0 0 40px #ff0000;
    opacity: 0;
    animation: fadeIn 2s 3s forwards;
  }
  @keyframes fadeIn {
    to {opacity: 1;}
  }
</style>
</head>
<body>
  <div class="welcome">Bem-vindo a BCM-TAXI</div>
  <div class="company-name">BCM - TAXÍ</div>

  <script>
    // Após 6 segundos, redireciona para login.html
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 6000);
  </script>
</body>
</html>
